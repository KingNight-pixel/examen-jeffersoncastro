<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Practico 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('./img/painting-mountain-lake-with-mountain-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }

        h1, h2 {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            padding: 20px 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 80%;
        }

        h1 {
            font-size: 2.5em;
            color: #5a6f72;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.6em;
            color: #6b8e8f;
        }

        h1, h2 {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        h1:hover, h2:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <h1>Tercera versión del examen práctico — con estilo y elegancia</h1>
    <h2>Este es el cambio con diseño, fondo natural y colores suaves</h2>
</body>
</html>
